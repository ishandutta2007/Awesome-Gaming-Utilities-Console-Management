<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: pulseWave 6s ease-in-out infinite alternate;
      }
      .pill {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      .pill-delay-1 { animation-delay: -1.5s; }
      .pill-delay-2 { animation-delay: -3s; }
      .pill-delay-3 { animation-delay: -4.5s; }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
        100% { transform: translate(120px, 60px) scale(1.3); opacity: 0.45; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.2); opacity: 0.2; }
        100% { transform: translate(-100px, -40px) scale(0.9); opacity: 0.4; }
      }
      @keyframes pulseWave {
        0% { opacity: 0.2; stroke-dashoffset: 0; }
        50% { opacity: 0.5; }
        100% { opacity: 0.3; stroke-dashoffset: 60; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Strictly in Background) -->
  <g id="dynamic-background">
    <!-- Glowing Orbs (Behind text, strictly blurred) -->
    <circle class="orb-1" cx="220" cy="140" r="130" fill="url(#neonCyan)" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="240" r="160" fill="url(#neonPurple)" filter="url(#glow)" />
    <circle class="orb-1" cx="600" cy="350" r="90" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />

    <!-- Animated Controller / Signal Waves in Background -->
    <path class="wave-line" d="M 50 320 Q 300 260 600 320 T 1150 300" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="8 6" />
    <path class="wave-line" d="M 50 340 Q 350 380 700 330 T 1150 350" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="2" stroke-dasharray="10 8" />

    <!-- Abstract Gaming Console / Controller Vector Icons in Background -->
    <g opacity="0.08" transform="translate(920, 40) scale(1.3)">
      <!-- Gamepad Outline -->
      <path d="M70,20 C40,20 20,40 10,80 C0,120 15,160 35,160 C50,160 60,140 75,140 C90,140 100,160 115,160 C135,160 150,120 140,80 C130,40 100,20 70,20 Z" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="45" cy="75" r="8" fill="#ffffff" />
      <circle cx="105" cy="70" r="4" fill="#ffffff" />
      <circle cx="115" cy="80" r="4" fill="#ffffff" />
      <circle cx="95" cy="80" r="4" fill="#ffffff" />
      <circle cx="105" cy="90" r="4" fill="#ffffff" />
    </g>

    <g opacity="0.08" transform="translate(60, 220) scale(1.1)">
      <!-- Console / Handheld Silhouette -->
      <rect x="0" y="0" width="140" height="75" rx="14" fill="none" stroke="#ffffff" stroke-width="3" />
      <rect x="30" y="10" width="80" height="55" rx="4" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="15" cy="35" r="6" fill="#ffffff" />
      <circle cx="125" cy="30" r="3" fill="#ffffff" />
      <circle cx="125" cy="42" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: Brand Titles & Subtitle (Always Clear and Unobstructed) -->
  <g id="foreground-content">
    <!-- Top Category Badge -->
    <g transform="translate(600, 70)" text-anchor="middle">
      <rect x="-210" y="-18" width="420" height="36" rx="18" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
        🎮 ULTIMATE GAMING UTILITIES CURATION
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#lightGlow)">
      Gaming Utilities &amp; Console Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="url(#subGrad)" letter-spacing="0.2">
      Remote Play • Low-Latency Streaming • 10-Foot Couch Launchers • SteamOS &amp; Handheld Tools
    </text>

    <!-- Interactive Floating Feature Pills (Well separated at bottom) -->
    <g id="feature-pills" transform="translate(600, 275)" text-anchor="middle">
      <!-- Pill 1: Remote Play -->
      <g class="pill" transform="translate(-360, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc">⚡ Remote Play</text>
      </g>

      <!-- Pill 2: Game Streaming -->
      <g class="pill pill-delay-1" transform="translate(-120, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">📡 Game Streaming</text>
      </g>

      <!-- Pill 3: Couch Launchers -->
      <g class="pill pill-delay-2" transform="translate(130, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe">🛋️ Couch Launchers</text>
      </g>

      <!-- Pill 4: Handheld & SteamOS -->
      <g class="pill pill-delay-3" transform="translate(370, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🕹️ SteamOS &amp; Deck</text>
      </g>
    </g>

    <!-- Bottom Meta Line -->
    <text x="600" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b" letter-spacing="1">
      CURATED OPEN-SOURCE REPOSITORIES &amp; COMMERCIAL ECOSYSTEMS • UPDATED REGULARLY
    </text>
  </g>
</svg>

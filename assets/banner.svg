<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0a14"/><stop offset="50%" stop-color="#0e1329"/><stop offset="100%" stop-color="#060810"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="neonCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b224ef"/><stop offset="100%" stop-color="#7579ff"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lightGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1);opacity:.25}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1.2);opacity:.2}}@keyframes pulseWave{0%{opacity:.2;stroke-dashoffset:0}50%{opacity:.5}}@keyframes floatPill{0%{transform:translateY(0)}}.orb-1{animation:floatOrb1 14s ease-in-out infinite alternate}.orb-2{animation:floatOrb2 18s ease-in-out infinite alternate}.wave-line{animation:pulseWave 6s ease-in-out infinite alternate}.pill{animation:floatPill 5s ease-in-out infinite alternate}.pill-delay-1{animation-delay:-1.5s}.pill-delay-2{animation-delay:-3s}.pill-delay-3{animation-delay:-4.5s}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><g id="dynamic-background"><circle cx="220" cy="140" r="130" fill="url(#neonCyan)" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="240" r="160" fill="url(#neonPurple)" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="350" r="90" fill="#38bdf8" class="orb-1" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="8 6" stroke-width="2" d="M 50 320 Q 300 260 600 320 T 1150 300" class="wave-line"/><path fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-dasharray="10 8" stroke-width="2" d="M 50 340 Q 350 380 700 330 T 1150 350" class="wave-line"/><g opacity=".08" transform="translate(920, 40) scale(1.3)"><path fill="none" stroke="#fff" stroke-width="3" d="M70,20 C40,20 20,40 10,80 C0,120 15,160 35,160 C50,160 60,140 75,140 C90,140 100,160 115,160 C135,160 150,120 140,80 C130,40 100,20 70,20 Z"/><circle cx="45" cy="75" r="8" fill="#fff"/><circle cx="105" cy="70" r="4" fill="#fff"/><circle cx="115" cy="80" r="4" fill="#fff"/><circle cx="95" cy="80" r="4" fill="#fff"/><circle cx="105" cy="90" r="4" fill="#fff"/></g><g opacity=".08" transform="translate(60, 220) scale(1.1)"><rect width="140" height="75" x="0" y="0" fill="none" stroke="#fff" stroke-width="3" rx="14"/><rect width="80" height="55" x="30" y="10" fill="none" stroke="#fff" stroke-width="2" rx="4"/><circle cx="15" cy="35" r="6" fill="#fff"/><circle cx="125" cy="30" r="3" fill="#fff"/><circle cx="125" cy="42" r="3" fill="#fff"/></g></g><g id="foreground-content"><g text-anchor="middle" transform="translate(600, 70)"><rect width="420" height="36" x="-210" y="-18" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.